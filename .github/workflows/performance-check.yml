name: Dashboard performance regression
on:
  push:
    branches: [main, feature/management-navigation-20261126, fix/almoxarifados-20261126, perf/initial-load-20261008, perf/initial-load-20261015, perf/purchases-20261015, feature/estoque-sem-baixas-20261015, data/estoque-20261015-1340, feature/stock-maximum-20261103, feature/analise-unificada-min-max-20261103, feature/cascade-colors-stock-20261103, feature/db-colors-withdrawals-20261103, feature/compact-stock-summary-20261103, feature/full-width-withdrawal-sorting-20261103, feature/horizontal-columns-no-purchase-value-20261103, feature/min-max-screenshot-layout-20261103, feature/filtro-situacao-produtos-20261103]
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the revision under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: app
      - name: Compile and verify datasets
        working-directory: app
        run: node scripts/build-fast.mjs --test
      - name: Verify stock, cost and purchasing regressions
        working-directory: app
        run: node --test tests/*.test.mjs
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Compare actual pages and exercise tabs
        working-directory: app
        run: python tests/test_fast_browser.py
      - name: Show test reports
        if: always()
        working-directory: app
        run: |
          cat build-report.json || true
          cat browser-test-report.json || true
