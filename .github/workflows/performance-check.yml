name: Dashboard performance regression
on:
  push:
    branches: [main, perf/initial-load-20261008, perf/initial-load-20261015, perf/purchases-20261015, feature/estoque-sem-baixas-20261015, data/estoque-20261015-1340, feature/stock-maximum-20261103, feature/analise-unificada-min-max-20261103, feature/cascade-colors-stock-20261103, feature/db-colors-withdrawals-20261103, feature/compact-stock-summary-20261103, feature/full-width-withdrawal-sorting-20261103, feature/horizontal-columns-no-purchase-value-20261103]
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public repository
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" app
      - name: Compile and verify datasets
        working-directory: app
        run: node scripts/build-fast.mjs --test
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Compare actual pages and exercise tabs
        working-directory: app
        run: python tests/test_fast_browser.py
      - name: Show test reports
        if: always()
        working-directory: app
        run: |
          cat build-report.json || true
          cat browser-test-report.json || true
