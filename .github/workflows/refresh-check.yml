name: Stock and retrospective movement verification
on:
  push:
    branches: [main, data/refresh-20261015]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved repository
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" app
      - name: Reconcile and compile
        working-directory: app
        run: |
          node scripts/prepare-current.mjs
          cp refresh-report.json /tmp/first-refresh-report.json
          node scripts/prepare-current.mjs
          cmp refresh-report.json /tmp/first-refresh-report.json
          node scripts/build-fast.mjs --test
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Existing browser regression
        working-directory: app
        run: python tests/test_fast_browser.py
      - name: Revised period assertions
        working-directory: app
        run: python tests/test_refresh_browser.py
      - name: Reports
        if: always()
        working-directory: app
        run: |
          cat refresh-report.json || true
          cat refresh-browser-report.json || true
          cat browser-test-report.json || true
